openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Blood Strike Scrim Hub API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User management
  - name: teams
    description: Team management
  - name: scrims
    description: Scrim management
  - name: matches
    description: Match management
  - name: scoreboard
    description: Scoreboard and leaderboard
  - name: violations
    description: Violation management
  - name: announcements
    description: Announcement management
  - name: dashboard
    description: Dashboard and stats

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/login:
    post:
      operationId: loginUser
      tags: [users]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get current user session
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /users/logout:
    post:
      operationId: logoutUser
      tags: [users]
      summary: Logout current user
      responses:
        "200":
          description: Logged out

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: User not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams
      responses:
        "200":
          description: List of teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a new team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamBody"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get team by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Team not found
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamBody"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Delete team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /teams/{id}/members:
    get:
      operationId: getTeamMembers
      tags: [teams]
      summary: Get team members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: inviteTeamMember
      tags: [teams]
      summary: Invite a user to team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberBody"
      responses:
        "201":
          description: Invite sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"

  /teams/{id}/members/{userId}/accept:
    post:
      operationId: acceptTeamInvite
      tags: [teams]
      summary: Accept team invite
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"

  /teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove team member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /scrims:
    get:
      operationId: listScrims
      tags: [scrims]
      summary: List all scrims
      responses:
        "200":
          description: List of scrims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scrim"
    post:
      operationId: createScrim
      tags: [scrims]
      summary: Create a new scrim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScrimBody"
      responses:
        "201":
          description: Created scrim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scrim"

  /scrims/{id}:
    get:
      operationId: getScrim
      tags: [scrims]
      summary: Get scrim by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scrim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scrim"
        "404":
          description: Scrim not found
    patch:
      operationId: updateScrim
      tags: [scrims]
      summary: Update scrim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScrimBody"
      responses:
        "200":
          description: Updated scrim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scrim"
    delete:
      operationId: deleteScrim
      tags: [scrims]
      summary: Delete scrim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /scrims/{id}/register:
    post:
      operationId: registerTeamToScrim
      tags: [scrims]
      summary: Register a team to a scrim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTeamBody"
      responses:
        "201":
          description: Team registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrimRegistration"

  /scrims/{id}/registrations:
    get:
      operationId: getScrimRegistrations
      tags: [scrims]
      summary: Get scrim registrations
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Registrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScrimRegistration"

  /scrims/{id}/matches:
    get:
      operationId: getScrimMatches
      tags: [scrims]
      summary: Get matches for a scrim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Match"
    post:
      operationId: createMatch
      tags: [matches]
      summary: Create a match in a scrim
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMatchBody"
      responses:
        "201":
          description: Created match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}:
    get:
      operationId: getMatch
      tags: [matches]
      summary: Get match by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"
    patch:
      operationId: updateMatch
      tags: [matches]
      summary: Update match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMatchBody"
      responses:
        "200":
          description: Updated match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Match"

  /matches/{id}/scores:
    get:
      operationId: getMatchScores
      tags: [scoreboard]
      summary: Get scores for a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Score"
    post:
      operationId: submitScore
      tags: [scoreboard]
      summary: Submit score for a team in a match
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitScoreBody"
      responses:
        "201":
          description: Score submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"

  /scrims/{id}/scoreboard:
    get:
      operationId: getScrimScoreboard
      tags: [scoreboard]
      summary: Get full scoreboard for a scrim (ranked)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ranked scoreboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScoreboardEntry"

  /leaderboard/teams:
    get:
      operationId: getTeamLeaderboard
      tags: [scoreboard]
      summary: Global team leaderboard
      responses:
        "200":
          description: Team rankings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamLeaderboardEntry"

  /leaderboard/players:
    get:
      operationId: getPlayerLeaderboard
      tags: [scoreboard]
      summary: Global player leaderboard
      responses:
        "200":
          description: Player rankings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerLeaderboardEntry"

  /violations:
    get:
      operationId: listViolations
      tags: [violations]
      summary: List all violations
      responses:
        "200":
          description: Violations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Violation"
    post:
      operationId: createViolation
      tags: [violations]
      summary: Create a violation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateViolationBody"
      responses:
        "201":
          description: Created violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Violation"

  /violations/{id}:
    patch:
      operationId: updateViolation
      tags: [violations]
      summary: Update violation (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateViolationBody"
      responses:
        "200":
          description: Updated violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Violation"

  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List all announcements
      responses:
        "200":
          description: Announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create an announcement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnouncementBody"
      responses:
        "201":
          description: Created announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/{id}:
    patch:
      operationId: updateAnnouncement
      tags: [announcements]
      summary: Update announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnnouncementBody"
      responses:
        "200":
          description: Updated announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Delete announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get overall dashboard stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/upcoming-scrims:
    get:
      operationId: getUpcomingScrims
      tags: [dashboard]
      summary: Get upcoming scrims (next 5)
      responses:
        "200":
          description: Upcoming scrims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scrim"

  /dashboard/recent-violations:
    get:
      operationId: getRecentViolations
      tags: [dashboard]
      summary: Get recent violations
      responses:
        "200":
          description: Recent violations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Violation"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        bloodStrikeId:
          type: string
        role:
          type: string
        enum: [player, captain, team_manager, admin]
        isBanned:
          type: boolean
        banExpiresAt:
          type: ["string", "null"]
        totalKills:
          type: integer
        totalWins:
          type: integer
        totalPoints:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - username
        - bloodStrikeId
        - role
        - isBanned
        - banExpiresAt
        - totalKills
        - totalWins
        - totalPoints
        - createdAt

    CreateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        bloodStrikeId:
          type: string
        role:
          type: string
        enum: [player, captain, team_manager, admin]
      required:
        - username
        - password
        - bloodStrikeId
        - role

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    UpdateUserBody:
      type: object
      properties:
        username:
          type: string
        bloodStrikeId:
          type: string
        role:
          type: string
        enum: [player, captain, team_manager, admin]
        isBanned:
          type: boolean
        banExpiresAt:
          type: ["string", "null"]

    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        logoUrl:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        captainId:
          type: integer
        captainUsername:
          type: ["string", "null"]
        totalPoints:
          type: integer
        totalKills:
          type: integer
        totalWins:
          type: integer
        memberCount:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - logoUrl
        - description
        - captainId
        - captainUsername
        - totalPoints
        - totalKills
        - totalWins
        - memberCount
        - createdAt

    CreateTeamBody:
      type: object
      properties:
        name:
          type: string
        logoUrl:
          type: string
        description:
          type: string
        captainId:
          type: integer
      required:
        - name
        - captainId

    UpdateTeamBody:
      type: object
      properties:
        name:
          type: string
        logoUrl:
          type: string
        description:
          type: string

    TeamMember:
      type: object
      properties:
        id:
          type: integer
        teamId:
          type: integer
        userId:
          type: integer
        username:
          type: ["string", "null"]
        bloodStrikeId:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, accepted, rejected]
        joinedAt:
          type: string
      required:
        - id
        - teamId
        - userId
        - username
        - bloodStrikeId
        - status
        - joinedAt

    InviteMemberBody:
      type: object
      properties:
        userId:
          type: integer
      required:
        - userId

    Scrim:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        scheduledAt:
          type: string
        maxTeams:
          type: integer
        bracketType:
          type: string
          enum: [low, high]
        status:
          type: string
          enum: [open, ongoing, finished]
        maps:
          type: array
          items:
            type: string
        totalRounds:
          type: integer
        flyTimeSeconds:
          type: integer
        weaponBans:
          type: array
          items:
            type: string
        itemBans:
          type: array
          items:
            type: string
        rules:
          type: ["string", "null"]
        createdByUsername:
          type: ["string", "null"]
        approvedByUsername:
          type: ["string", "null"]
        approvedAt:
          type: ["string", "null"]
        registeredTeams:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - name
        - scheduledAt
        - maxTeams
        - bracketType
        - status
        - maps
        - totalRounds
        - flyTimeSeconds
        - weaponBans
        - itemBans
        - rules
        - createdByUsername
        - approvedByUsername
        - approvedAt
        - registeredTeams
        - createdAt

    CreateScrimBody:
      type: object
      properties:
        name:
          type: string
        scheduledAt:
          type: string
        maxTeams:
          type: integer
        bracketType:
          type: string
          enum: [low, high]
        maps:
          type: array
          items:
            type: string
        totalRounds:
          type: integer
        flyTimeSeconds:
          type: integer
        weaponBans:
          type: array
          items:
            type: string
        itemBans:
          type: array
          items:
            type: string
        rules:
          type: string
        createdBy:
          type: integer
      required:
        - name
        - scheduledAt
        - maxTeams
        - bracketType
        - maps
        - totalRounds
        - flyTimeSeconds
        - createdBy

    UpdateScrimBody:
      type: object
      properties:
        name:
          type: string
        scheduledAt:
          type: string
        maxTeams:
          type: integer
        bracketType:
          type: string
          enum: [low, high]
        status:
          type: string
          enum: [open, ongoing, finished]
        maps:
          type: array
          items:
            type: string
        totalRounds:
          type: integer
        flyTimeSeconds:
          type: integer
        weaponBans:
          type: array
          items:
            type: string
        itemBans:
          type: array
          items:
            type: string
        rules:
          type: string

    ScrimRegistration:
      type: object
      properties:
        id:
          type: integer
        scrimId:
          type: integer
        teamId:
          type: integer
        teamName:
          type: ["string", "null"]
        registeredAt:
          type: string
      required:
        - id
        - scrimId
        - teamId
        - teamName
        - registeredAt

    RegisterTeamBody:
      type: object
      properties:
        teamId:
          type: integer
      required:
        - teamId

    Match:
      type: object
      properties:
        id:
          type: integer
        scrimId:
          type: integer
        matchNumber:
          type: integer
        mapName:
          type: string
        roundNumber:
          type: integer
        status:
          type: string
          enum: [pending, active, finished]
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - scrimId
        - matchNumber
        - mapName
        - roundNumber
        - status
        - startTime
        - endTime
        - createdAt

    CreateMatchBody:
      type: object
      properties:
        matchNumber:
          type: integer
        mapName:
