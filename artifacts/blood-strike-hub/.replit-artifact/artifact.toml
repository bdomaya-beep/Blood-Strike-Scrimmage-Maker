kind = "web"
previewPath = "/"
title = "Blood Strike Scrim Hub"
version = "1.0.0"
id = "artifacts/blood-strike-hub"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19712

[services.development]
run = "pnpm --filter @workspace/blood-strike-hub run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/blood-strike-hub", "run", "build" ]
publicDir = "artifacts/blood-strike-hub/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19712"
BASE_PATH = "/"
