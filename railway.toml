[build]
builder = "nixpacks"
buildCommand = "npm ci && npx prisma generate --schema=packages/db/prisma/schema.prisma && npm -w @bssh/api run build"

[deploy]
startCommand = "sh ./scripts/docker-start.sh"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
