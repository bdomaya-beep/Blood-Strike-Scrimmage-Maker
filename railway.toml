[build]
builder = "nixpacks"
buildCommand = "npm ci && npx prisma generate --schema=packages/db/prisma/schema.prisma && npm -w @bssh/api run build"

[deploy]
startCommand = "npx prisma migrate deploy --schema=packages/db/prisma/schema.prisma || npx prisma db push --schema=packages/db/prisma/schema.prisma --skip-generate && node apps/api/dist/main.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
